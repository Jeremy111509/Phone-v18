<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebDisplays Bedrock</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080d16;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 18px;
  background: #111c2b;
  font-size: 21px;
  font-weight: bold;
  border-bottom: 1px solid #263d55;
}

.browser {
  padding: 14px;
}

.address {
  display: flex;
  gap: 7px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border-radius: 12px;
  border: 1px solid #344c66;
  background: #172438;
  color: white;
  font-size: 14px;
}

button {
  border: none;
  border-radius: 10px;
  padding: 12px;
  background: #159ed8;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  background: #18b2f3;
}

.tabs {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.tabs button {
  flex: 1;
  background: #20364d;
}

.tabs button:active {
  background: #159ed8;
}

.screen {
  margin-top: 15px;
  height: 72vh;
  min-height: 350px;
  background: white;
  border-radius: 13px;
  overflow: hidden;
  position: relative;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
}

.home {
  background: #111c2b;
  height: 100%;
  text-align: center;
  padding: 60px 15px;
}

.home h1 {
  color: #38baff;
  font-size: 30px;
}

.home p {
  color: #a9bdd0;
}

.message {
  color: #a9bdd0;
  font-size: 12px;
  padding: 12px 3px;
  line-height: 1.5;
}

footer {
  text-align: center;
  padding: 12px;
  color: #728ba2;
  font-size: 12px;
}
</style>
</head>

<body>

<header>🌐 WebDisplays Bedrock</header>

<div class="browser">

  <div class="address">
    <input id="url"
      placeholder="Escribe una URL o busca..."
      type="text">

    <button onclick="go()">IR</button>
  </div>

  <div class="tabs">
    <button onclick="searchGoogle()">Google</button>
    <button onclick="searchYoutube()">YouTube</button>
    <button onclick="home()">Inicio</button>
  </div>

  <div class="screen" id="screen">
    <div class="home">
      <h1>WebPhone</h1>
      <p>Tu navegador WebDisplays Bedrock</p>
      <p>Escribe una dirección web para empezar.</p>
    </div>
  </div>

  <div class="message" id="message">
    Consejo: Si una página web no carga dentro del marco por restricciones de seguridad, usa el botón de abajo para verla completa.
  </div>

  <button style="width:100%; margin-bottom: 8px;"
    onclick="external()">
    Abrir página externamente
  </button>

</div>

<footer>
WebDisplays Bedrock · Experimental v3
</footer>

<script>

let currentURL = "";

function normalize(value) {
  value = value.trim();
  if (!value) return "";

  // Si es un término de búsqueda (tiene espacios o no tiene punto)
  if (value.includes(" ") || !value.includes(".")) {
    return "https://html.duckduckgo.com/html/?q=" + encodeURIComponent(value);
  }

  if (!/^https?:\/\//i.test(value)) {
    value = "https://" + value;
  }

  return value;
}

function loadPage(url) {
  currentURL = url;
  document.getElementById("url").value = url;

  const screen = document.getElementById("screen");
  screen.innerHTML = "";

  const frame = document.createElement("iframe");
  
  // Usamos un proxy de redirección HTML para evitar bloqueos en la mayoría de webs
  frame.src = "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
  frame.title = "WebDisplays Browser";

  screen.appendChild(frame);
}

function go() {
  const value = document.getElementById("url").value;
  const url = normalize(value);
  if (url) loadPage(url);
}

function searchGoogle() {
  loadPage("https://html.duckduckgo.com/");
}

function searchYoutube() {
  loadPage("https://www.youtube.com/");
}

function home() {
  currentURL = "";
  document.getElementById("url").value = "";

  document.getElementById("screen").innerHTML = `
    <div class="home">
      <h1>WebPhone</h1>
      <p>Bienvenido a WebDisplays</p>
      <p>Tu navegador experimental.</p>
    </div>
  `;
}

function external() {
  const inputVal = document.getElementById("url").value;
  const target = currentURL || normalize(inputVal);
  if (target) {
    window.open(target, "_blank");
  }
}

document.getElementById("url")
  .addEventListener("keydown", function(event) {
    if (event.key === "Enter") go();
  });

</script>

</body>
</html>
